<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync In — Music Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mood-field" id="moodField">
  <div class="mood-blob mood-blob--a"></div>
  <div class="mood-blob mood-blob--b"></div>
  <div class="mood-blob mood-blob--c"></div>
  <div class="mood-grain"></div>
</div>

<div class="app-shell">

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18V5l12-2v13" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="#fff" stroke-width="1.8"/><circle cx="18" cy="16" r="3" stroke="#fff" stroke-width="1.8"/></svg>
      </div>
      <div>
        <h1>Sync In</h1>
        <span>Mood-reactive player</span>
      </div>
    </div>

    <div class="search-shell" id="searchShell">
      <svg class="icon-search" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search your library or YouTube…">
      <svg class="search-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-dasharray="40" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></circle></svg>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="sidebarToggle" title="Menu" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="drawerToggle" title="Queue &amp; Lyrics" aria-label="Toggle queue and lyrics">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h12M4 12h12M4 18h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 15l3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle light and dark theme">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main">

    <aside class="sidebar" id="sidebar">
      <nav id="sidebarNav">
        <div class="nav-section">
          <h3>Library</h3>
          <ul class="nav-list">
            <li class="nav-item active" data-view="home">
              <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Home</span>
            </li>
            <li class="nav-item" data-view="favorites">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.2-4.6-9.7-9A5.5 5.5 0 0112 6.5 5.5 5.5 0 0121.7 12c-2.5 4.4-9.7 9-9.7 9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              <span>Favorites</span>
            </li>
            <li class="nav-item" data-view="queue">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h10M4 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span>Queue</span>
              <span class="queue-count hidden" id="sidebarQueueCount">0</span>
            </li>
          </ul>
        </div>
        <div class="nav-section">
          <h3>Playlists</h3>
          <ul class="nav-list" id="playlistList"></ul>
          <button class="btn-ghost" id="newPlaylistBtn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            New Playlist
          </button>
        </div>
      </nav>
    </aside>

    <section class="content-well">
      <div class="main-view" id="mainView"></div>
    </section>

    <aside class="drawer collapsed" id="drawer">
      <div class="drawer-tabs">
        <button class="drawer-tab active" data-tab="queue">Queue</button>
        <button class="drawer-tab" data-tab="lyrics">Lyrics</button>
      </div>
      <div class="drawer-body">
        <div class="drawer-panel active" id="queuePanel">
          <div class="drawer-panel-head">
            <h4 id="queueHeading">Up next</h4>
            <button id="clearQueueBtn">Clear</button>
          </div>
          <ul class="queue-list" id="queueList"></ul>
        </div>
        <div class="drawer-panel" id="lyricsPanel">
          <div class="drawer-panel-head"><h4>Lyrics</h4></div>
          <div class="lyrics-body" id="lyricsBody">
            <p class="lyrics-status">Play a track to see lyrics here.</p>
          </div>
        </div>
      </div>
    </aside>

  </main>

  <footer class="player-bar">
    <canvas class="player-viz" id="vizCanvas"></canvas>
    <div class="player-inner">

      <div class="now-playing-block">
        <div class="np-art-wrap" id="npArtWrap">
          <img src="covers/default.jpg" alt="" id="songArt">
          <div id="ytFrame" title="YouTube audio"></div>
        </div>
        <div class="np-text">
          <h4 class="np-title" id="songTitle">Select a song</h4>
          <p class="np-artist" id="songArtist">Nothing playing</p>
        </div>
        <button class="np-fav" id="playerFavBtn" title="Favorite" aria-label="Toggle favorite">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.2-4.6-9.7-9A5.5 5.5 0 0112 6.5 5.5 5.5 0 0121.7 12c-2.5 4.4-9.7 9-9.7 9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="transport">
        <div class="transport-buttons">
          <button id="prevBtn" title="Previous"><svg viewBox="0 0 24 24" fill="none"><path d="M19 5v14L8 12l11-7z" fill="currentColor"/><rect x="5" y="5" width="2" height="14" fill="currentColor"/></svg></button>
          <button class="btn-play" id="playPauseBtn" title="Play/Pause">
            <svg id="playIcon" viewBox="0 0 24 24" fill="none"><path d="M7 5l13 7-13 7V5z" fill="currentColor"/></svg>
            <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" fill="none"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>
          </button>
          <button id="nextBtn" title="Next"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5v14l11-7L5 5z" fill="currentColor"/><rect x="17" y="5" width="2" height="14" fill="currentColor"/></svg></button>
        </div>
        <div class="progress-row">
          <span class="time-label" id="currentTime">0:00</span>
          <div class="progress-track"><input type="range" id="progressBar" value="0" step="1"></div>
          <span class="time-label" id="totalDuration">0:00</span>
        </div>
      </div>

      <div class="side-controls">
        <button class="icon-btn toggle-btn" id="crossfadeToggle" title="Toggle crossfade" aria-label="Toggle crossfade">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 8c4 0 4 8 8 8s4-8 8-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn toggle-btn" id="repeatToggle" title="Repeat mode" aria-label="Cycle repeat mode">
          <svg viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div style="position:relative;">
          <button class="icon-btn toggle-btn" id="sleepTimerBtn" title="Sleep timer" aria-label="Sleep timer">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <div class="popover hidden" id="sleepPopover" style="bottom:52px; right:0;">
            <h4>Sleep timer</h4>
            <div class="timer-grid">
              <button class="timer-chip" data-mins="15">15 min</button>
              <button class="timer-chip" data-mins="30">30 min</button>
              <button class="timer-chip" data-mins="45">45 min</button>
              <button class="timer-chip" data-mins="60">60 min</button>
            </div>
            <div class="timer-status hidden" id="timerStatus">—</div>
            <button class="timer-cancel hidden" id="timerCancelBtn">Cancel timer</button>
          </div>
        </div>
        <div class="volume-row">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/></svg>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>

    </div>
  </footer>

  <audio id="audioA" crossorigin="anonymous"></audio>
  <audio id="audioB" crossorigin="anonymous"></audio>
</div>

<div class="toast-stack" id="toastStack"></div>

<div class="modal-backdrop hidden" id="playlistModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>New playlist</h3>
      <button id="closeModal" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="playlistName">Name</label>
        <input type="text" id="playlistName" placeholder="Late night drive">
      </div>
      <div class="field">
        <label for="playlistDescription">Description</label>
        <textarea id="playlistDescription" rows="2" placeholder="Optional"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn--outline" id="cancelPlaylist">Cancel</button>
      <button class="btn btn--primary" id="savePlaylist">Create</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
